name: Work
on:
  push:
    branches:
      - 'master'
  schedule:
    - cron: '15 3,8,20 * * *'
  workflow_dispatch:
jobs:
  work:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install nix
        uses: cachix/install-nix-action@v31

      # Same pinned devshell as local development (.nix/flake.lock).
      - name: Install dependencies
        run: |
          nix develop "path:$PWD/.nix" --command pnpm install --frozen-lockfile

      - name: Work!
        env:
          REPO_GITHUB_TOKEN: ${{ secrets.REPO_GITHUB_TOKEN }}
        run: |
          nix develop "path:$PWD/.nix" --command pnpm tsx src '*' --push
